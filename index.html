<title>Movie Watchlist 1980–Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one reading column; decades fold open to years, years fold open to films; sticky control bar */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --ink:#151A2E; --muted:#5D6480; --line:#DFE2EC;
  --accent:#2E3FB8; --gold:#A87400; --gold-soft:#F6EBCF; --seen:#E9ECF6;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#161A2C; --ink:#E7E9F3; --muted:#9CA2BD; --line:#272C45;
  --accent:#8E9BFF; --gold:#E7B84A; --gold-soft:#3A3018; --seen:#1D2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#161A2C; --ink:#E7E9F3; --muted:#9CA2BD; --line:#272C45;
  --accent:#8E9BFF; --gold:#E7B84A; --gold-soft:#3A3018; --seen:#1D2238; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{color:var(--gold)}
.progress{margin-top:16px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.count{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.sync{font-size:12px;color:var(--muted);margin-top:6px;min-height:1em}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 13px var(--body);padding:7px 14px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{font:600 13px var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent);cursor:pointer}
.spacer{flex:1}
select,.toggle{font:500 13px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);margin:0}
button:focus-visible,select:focus-visible,.toggle:focus-within,.film:focus-within,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
summary::-webkit-details-marker{display:none}
.chev{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s}
details[open] > summary .chev{transform:rotate(90deg)}
.mini{flex:none;width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.tally{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:4.5em;text-align:right}
.grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

details.top{margin-top:4px;border-bottom:2px solid var(--ink)}
details.top > summary{padding-block:16px 10px}
details.top > summary h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:.02em;text-transform:uppercase}
details.top > summary .sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
details.top[open] > summary{border-bottom:1px solid var(--line)}

details.yr > summary{padding:12px 4px 12px 14px}
details.yr > summary h3{font-family:var(--display);font-weight:600;font-size:24px;line-height:1;margin:0;letter-spacing:.02em}
details.yr > summary .sub{font-size:12px;color:var(--muted)}
details.yr:last-child{border-bottom:0}
details.yr > ul{padding:0 0 10px 14px}

ul{list-style:none;margin:0;padding:0}
.film{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px}
.film input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
.film .t{flex:1;min-width:0;font-weight:500}
.film .meta{display:flex;gap:6px;align-items:center;flex:none}
.film.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.film.done{background:var(--seen)}
.tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.y{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.star{color:var(--gold);font-size:17px;line-height:1;width:1em;text-align:center}
.bp{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:4px;padding:2px 6px;white-space:nowrap}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:480px){.film .tag{display:none}details.top > summary h2{font-size:30px}.mini{display:none}}
@media (prefers-reduced-motion:reduce){.bar i,.chev{transition:none}}
</style>
</head>

const FILMS = [];
for (const y of Object.keys(DATA)) DATA[y].forEach(([t,g,o]) => FILMS.push({id:y+":"+t, year:+y, title:t, genre:g, oscar:o}));
const TOTAL = FILMS.length;
const GENRES = [...new Set(FILMS.map(f=>f.genre))].sort();
const YEARS = Object.keys(DATA).map(Number);

const $ = id => document.getElementById(id);
const state = { seen:new Set(), open:new Set(), mode:"year", genre:"", oscarOnly:false, hideSeen:false };

// --- local cache (this browser) ---
const LS = "mw-seen-v1", LSUI = "mw-ui-v2";
try { JSON.parse(localStorage.getItem(LS)||"[]").forEach(i=>state.seen.add(i)); } catch(e){}
try {
  const u = JSON.parse(localStorage.getItem(LSUI)||"{}");
  ["mode","genre","oscarOnly","hideSeen"].forEach(k=>{ if (k in u) state[k]=u[k]; });
  (u.open||[]).forEach(k=>state.open.add(k));
} catch(e){}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify([...state.seen])); }catch(e){} }
function saveUI(){ try{ localStorage.setItem(LSUI, JSON.stringify({mode:state.mode,genre:state.genre,oscarOnly:state.oscarOnly,hideSeen:state.hideSeen,open:[...state.open]})); }catch(e){} }

// Seen films are saved in this browser (localStorage).
function queueSync(){}

// --- render ---
const CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const seenCount = fs => fs.reduce((n,f)=>n+(state.seen.has(f.id)?1:0),0);
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function visible(f){
  if (state.genre && f.genre !== state.genre) return false;
  if (state.oscarOnly && !f.oscar) return false;
  if (state.hideSeen && state.seen.has(f.id)) return false;
  return true;
}

function filmLi(f, showYear){
  const li = document.createElement("li");
  const lab = document.createElement("label");
  lab.className = "film" + (state.seen.has(f.id) ? " done" : "");
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = state.seen.has(f.id); cb.dataset.id = f.id;
  cb.id = "f-" + f.id.replace(/[^a-z0-9]/gi,"-");
  const t = document.createElement("span"); t.className = "t"; t.textContent = f.title;
  const meta = document.createElement("span"); meta.className = "meta";
  if (f.oscar === 2){ const b=document.createElement("span"); b.className="bp"; b.textContent="Best Picture"; meta.append(b); }
  if (showYear){ const y=document.createElement("span"); y.className="y"; y.textContent=f.year; meta.append(y); }
  else { const g=document.createElement("span"); g.className="tag"; g.textContent=f.genre; meta.append(g); }
  const s=document.createElement("span"); s.className="star";
  if (f.oscar){ s.textContent="★"; s.title="Academy Award winner"; s.setAttribute("aria-label","Academy Award winner"); }
  meta.append(s);
  lab.append(cb,t,meta); li.append(lab);
  return li;
}

function makeDetails(key, cls, headHTML, all){
  const d = document.createElement("details");
  d.className = cls; d.dataset.key = key; d.open = state.open.has(key);
  const n = seenCount(all), pct = all.length ? n/all.length*100 : 0;
  const s = document.createElement("summary");
  s.innerHTML = CHEV + `<span class="grow">${headHTML}</span><span class="mini"><i style="width:${pct}%"></i></span><span class="tally">${n}/${all.length}</span>`;
  d.append(s);
  return d;
}

function render(){
  const n = seenCount(FILMS);
  $("count").textContent = n + " / " + TOTAL + " seen";
  $("barFill").style.width = (n/TOTAL*100) + "%";
  $("byYear").setAttribute("aria-pressed", state.mode==="year");
  $("byGenre").setAttribute("aria-pressed", state.mode==="genre");
  $("genre").value = state.genre; $("oscarOnly").checked = state.oscarOnly; $("hideSeen").checked = state.hideSeen;

  const list = $("list"); list.textContent = "";
  let shown = 0;
  if (state.mode === "year"){
    const decades = [...new Set(YEARS.map(y=>Math.floor(y/10)*10))];
    for (const dec of decades){
      const yrs = YEARS.filter(y=>Math.floor(y/10)*10===dec);
      const decAll = FILMS.filter(f=>yrs.includes(f.year));
      if (!decAll.some(visible)) continue;
      const span = yrs[0] + "–" + yrs[yrs.length-1];
      const dd = makeDetails("d"+dec, "top", `<h2>The ${dec}s</h2><span class="sub">${span}</span>`, decAll);
      for (const y of yrs){
        const all = FILMS.filter(f=>f.year===y), fs = all.filter(visible);
        if (!fs.length) continue;
        const yd = makeDetails("y"+y, "yr", `<h3>${y}</h3><span class="sub">${ordinal(y-1927)} Academy Awards</span>`, all);
        const ul = document.createElement("ul"); fs.forEach(f=>ul.append(filmLi(f,false)));
        yd.append(ul); dd.append(yd); shown += fs.length;
      }
      list.append(dd);
    }
  } else {
    for (const g of GENRES){
      if (state.genre && g!==state.genre) continue;
      const all = FILMS.filter(f=>f.genre===g), fs = all.filter(visible);
      if (!fs.length) continue;
      const gd = makeDetails("g"+g, "top", `<h2>${g}</h2><span class="sub">${all.length} films</span>`, all);
      const ul = document.createElement("ul"); ul.style.padding = "0 0 10px 14px";
      fs.forEach(f=>ul.append(filmLi(f,true)));
      gd.append(ul); list.append(gd); shown += fs.length;
    }
  }
  if (!shown){ const e=document.createElement("p"); e.className="empty"; e.textContent = state.hideSeen ? "You've seen everything that matches these filters." : "No films match these filters."; list.append(e); }
}

// --- events ---
GENRES.forEach(g=>{ const o=document.createElement("option"); o.value=g; o.textContent=g; $("genre").append(o); });
$("list").addEventListener("toggle", e=>{
  const d = e.target; if (!d.dataset || !d.dataset.key) return;
  d.open ? state.open.add(d.dataset.key) : state.open.delete(d.dataset.key);
  saveUI();
}, true);
$("list").addEventListener("change", e=>{
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? state.seen.add(id) : state.seen.delete(id);
  saveLocal(); queueSync();
  const fid = e.target.id;
  render();
  const again = document.getElementById(fid); if (again) again.focus({preventScroll:true});
});
function setAll(open){
  document.querySelectorAll("#list details").forEach(d=>{
    d.open = open;
    open ? state.open.add(d.dataset.key) : state.open.delete(d.dataset.key);
  });
  saveUI();
}
$("expandAll").onclick = ()=>setAll(true);
$("collapseAll").onclick = ()=>setAll(false);
$("byYear").onclick = ()=>{ state.mode="year"; saveUI(); render(); };
$("byGenre").onclick = ()=>{ state.mode="genre"; saveUI(); render(); };
$("genre").onchange = e=>{ state.genre=e.target.value; saveUI(); render(); };
$("oscarOnly").onchange = e=>{ state.oscarOnly=e.target.checked; saveUI(); render(); };
$("hideSeen").onchange = e=>{ state.hideSeen=e.target.checked; saveUI(); render(); };
render();
</script>
